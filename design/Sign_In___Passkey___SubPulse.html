        <div class="grid grid-cols-2 gap-gutter-sm">

            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">account_circle</span>
            <span data-design-text-token="label-sm">Google</span>
          </button>
        </div>

      <div class="flex items-center gap-gutter-sm">

          <input id="auth-email" type="email" value="alex.morgan@icloud.com" required class="w-full min-h-[44px] px-3.5 py-2.5 rounded-DEFAULT bg-light-surface-container-low dark:bg-dark-surface-container-low border border-light-outline-variant dark:border-dark-outline-variant text-light-on-surface dark:text-dark-on-surface font-body text-title-md focus:border-light-primary focus:ring-1 focus:ring-light-primary">
        </div>

        <div class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between">

            </button>
          </div>
        </div>

        </button>

          <span data-design-text-token="label-sm">Send one-time magic link instead</span>
        </button>
      </form>

    <!-- Local-only / Guest Mode -->
    <footer class="text-center">
      <a href="../dashboard/Dashboard.html" class="inline-flex items-center justify-center min-h-[44px] px-4 font-label text-label-sm text-light-on-surface-variant dark:text-dark-on-surface-variant hover:text-light-on-surface dark:hover:text-dark-on-surface">
        <span data-design-text-token="label-sm">Continue in local-only guest mode</span>
      </a>
    </footer>
  </div>

  <script>
    (function () {
      const pwInput = document.getElementById('auth-password');
      const toggleBtn = document.getElementById('toggle-pw');
      const pwIcon = document.getElementById('pw-icon');
      if (pwInput && toggleBtn && pwIcon) {
        toggleBtn.addEventListener('click', function () {
          const isPw = pwInput.type === 'password';
          pwInput.type = isPw ? 'text' : 'password';
          pwIcon.textContent = isPw ? 'visibility_off' : 'visibility';
        });
      }
    })();
  </script>
